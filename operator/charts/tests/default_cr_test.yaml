# The CR must be an ordinary release resource. As a post-install/post-upgrade
# hook with Helm's default before-hook-creation policy it was deleted and
# recreated on every upgrade, which tore down the node daemons, and uninstall
# left it behind with its finalizer.
suite: default GpuFractioningConfig
chart:
  version: 0.1.0
  appVersion: 0.1.0
tests:
  - it: is a release resource, not a hook
    templates:
      - default-cr.yaml
    asserts:
      - isKind:
          of: GpuFractioningConfig
      - equal:
          path: metadata.name
          value: default
      - notExists:
          path: metadata.annotations

  - it: selects GPU nodes and keeps fractioningAgent present for API defaults
    templates:
      - default-cr.yaml
    asserts:
      - equal:
          path: spec.nodeSelector
          value:
            nvidia.com/gpu.present: "true"
      - exists:
          path: spec.fractioningAgent
