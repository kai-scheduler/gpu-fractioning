apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpufractioningconfigs.gpu-fractioning.kai.scheduler
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    # Install/upgrade the CRD ahead of the main release (operator Deployment) and
    # well before the post-install "default" GpuFractioningConfig hook, so the CRD is
    # Established before any custom resource of its kind is applied. Without this
    # the post-install CR hook can race CRD establishment (observed flaking e2e).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # Keep the CRD (and therefore any GpuFractioningConfig data) on `helm uninstall`.
    "helm.sh/resource-policy": keep
spec:
  group: gpu-fractioning.kai.scheduler
  names:
    kind: GpuFractioningConfig
    listKind: GpuFractioningConfigList
    plural: gpufractioningconfigs
    singular: gpufractioningconfig
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: GpuFractioningConfig is the Schema for the gpufractioningconfigs API
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: "self.metadata.name == 'default'"
              message: "GpuFractioningConfig must be named 'default'"
          properties:
            apiVersion:
              description: >-
                APIVersion defines the versioned schema of this representation
                of an object.
              type: string
            kind:
              description: >-
                Kind is a string value representing the REST resource this
                object represents.
              type: string
            metadata:
              type: object
            spec:
              description: spec defines the desired state of GpuFractioningConfig
              type: object
              required:
                - nodeSelector
              properties:
                nodeSelector:
                  description: >-
                    nodeSelector determines which nodes the managed DaemonSets
                    (fractiond, mpsd) target. All daemons share the same selector.
                    The field is immutable: retargeting requires deleting and
                    recreating the GpuFractioningConfig.
                  type: object
                  additionalProperties:
                    type: string
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: nodeSelector is immutable; delete and recreate the GpuFractioningConfig to change it
                runtimeClassName:
                  description: >-
                    runtimeClassName sets the RuntimeClass for daemon pods that need
                    NVIDIA GPU/NVML access. Defaults to "nvidia" when unset. Set to
                    "" to use the node default (only safe when the default runtime
                    already provides NVIDIA GPU/NVML access).
                  type: string
                fractioningAgent:
                  description: fractioningAgent configures the NRI-based fractioning agent (fractiond).
                  type: object
                  properties:
                    annotationPrefix:
                      type: string
                    failOpen:
                      type: boolean
                    nriSocketPath:
                      type: string
                    retroactiveEnforcement:
                      type: boolean
                      default: true
                    criSocketPath:
                      type: string
                    logLevel:
                      type: string
                    retryInterval:
                      type: string
                    stableThreshold:
                      type: string
                    maxRetries:
                      type: integer
                      format: int32
                    readinessPort:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 65535
                    mpsDrainSocketPath:
                      description: >-
                        mpsDrainSocketPath is the host path of the unix socket mpsd
                        serves its MPS client-drain endpoint on. fractiond calls it
                        from its StopContainer hook so a container's MPS clients are
                        drained before the runtime kills them. Must match
                        mpsDaemon.drainSocketPath. "" disables the drain call.
                      type: string
                    mpsDrainTimeout:
                      description: >-
                        mpsDrainTimeout bounds how long StopContainer waits for the
                        drain. Expiry never blocks the container stop. Default: 15s.
                      type: string
                    resources:
                      properties:
                        claims:
                          items:
                            properties:
                              name:
                                type: string
                              request:
                                type: string
                            required:
                            - name
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        limits:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          type: object
                        requests:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: 'resources.claims is not supported: the operator builds the daemon pod spec and never populates
                          spec.resourceClaims, so a claim entry could not resolve'
                        rule: '!has(self.claims) || size(self.claims) == 0'
                      description: resources overrides the compute resources of the fractiond container, merged over the built-in
                        defaults.
                metricsAgent:
                  description: >-
                    metricsAgent configures the GPU metrics exporter (metricsd),
                    which runs as a sidecar container in the same DaemonSet as
                    fractiond and reads the container→pod mapping from a shared volume.
                  type: object
                  properties:
                    enabled:
                      description: >-
                        enabled controls whether the metricsd sidecar is added to
                        the DaemonSet. Default: true.
                      type: boolean
                    logLevel:
                      description: >-
                        logLevel controls the logging verbosity of the metrics agent.
                        One of debug, info, warn, error. Default: info.
                      type: string
                    address:
                      description: >-
                        address is the Prometheus exporter listen address. Default: :2112.
                      type: string
                    path:
                      description: >-
                        path is the HTTP path on which metrics are served. Default: /metrics.
                      type: string
                    volumes:
                      description: volumes are additional volumes to add to the fractiond DaemonSet pod.
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    volumeMounts:
                      description: volumeMounts are additional volume mounts to add to the metricsd container.
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    metricNames:
                      description: >-
                        metricNames overrides the exported Prometheus metric names.
                        Empty fields keep the built-in gpu_fractioning_* defaults. Set
                        these to make metricsd emit the names a downstream consumer
                        expects. Labels are fixed
                        (namespace, pod, pod_uuid, gpu_uuid, gpu).
                      type: object
                      properties:
                        gpuMemoryUsedBytes:
                          type: string
                        gpuSmUtilizationPercent:
                          type: string
                        gpuSmUtilizationPercentNormalized:
                          type: string
                    resources:
                      properties:
                        claims:
                          items:
                            properties:
                              name:
                                type: string
                              request:
                                type: string
                            required:
                            - name
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        limits:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          type: object
                        requests:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: 'resources.claims is not supported: the operator builds the daemon pod spec and never populates
                          spec.resourceClaims, so a claim entry could not resolve'
                        rule: '!has(self.claims) || size(self.claims) == 0'
                      description: resources overrides the compute resources of the metricsd container, merged over the built-in
                        defaults.
                mpsDaemon:
                  description: mpsDaemon configures the MPS daemon supervisor (mpsd).
                  type: object
                  properties:
                    logLevel:
                      type: string
                    backoff:
                      type: string
                    maxRetries:
                      type: integer
                      format: int32
                    stableThreshold:
                      type: string
                    gracefulStopDelay:
                      type: string
                    drainSocketPath:
                      description: >-
                        drainSocketPath is the host path of the unix socket mpsd
                        serves its MPS client-drain endpoint on. Must match
                        fractioningAgent.mpsDrainSocketPath. "" disables the endpoint.
                      type: string
                    recycleWhenIdle:
                      description: >-
                        recycleWhenIdle restarts the MPS control daemon once the last
                        MPS client on the node disconnects through a drain, so an
                        unconsumed fault can never outlive the workload that caused
                        it. Default: true.
                      type: boolean
                    clientDrainTimeout:
                      description: >-
                        clientDrainTimeout bounds how long mpsd waits for one MPS
                        client to drain. Exceeding it is treated as a wedged MPS
                        server and escalates to a restart. Default: 30s.
                      type: string
                    resources:
                      properties:
                        claims:
                          items:
                            properties:
                              name:
                                type: string
                              request:
                                type: string
                            required:
                            - name
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                        limits:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          type: object
                        requests:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: 'resources.claims is not supported: the operator builds the daemon pod spec and never populates
                          spec.resourceClaims, so a claim entry could not resolve'
                        rule: '!has(self.claims) || size(self.claims) == 0'
                      description: resources overrides the compute resources of the mpsd container, merged over the built-in
                        defaults. The default is sized for up to 8 GPUs per node (one MPS server context per GPU, ~50 MiB
                        of host memory each).
            status:
              description: status defines the observed state of GpuFractioningConfig
              type: object
              properties:
                observedGeneration:
                  description: >-
                    observedGeneration is the most recent generation observed
                    by the controller.
                  format: int64
                  type: integer
                conditions:
                  description: >-
                    conditions represent the latest available observations of
                    the config's state.
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
