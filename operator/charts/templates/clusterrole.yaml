apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-fractioning.fullname" . }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
rules:
  # Watch for GpuFractioningConfig changes, read the resource, and update it to
  # add/remove the node-condition cleanup finalizer (metadata.finalizers is
  # modified through the main resource, not the finalizers subresource).
  - apiGroups:
      - gpu-fractioning.kai.scheduler
    resources:
      - gpufractioningconfigs
    verbs:
      - get
      - list
      - watch
      - update
  # Update finalizers on the CR so the controller can register cleanup
  # logic that runs before the resource is deleted.
  - apiGroups:
      - gpu-fractioning.kai.scheduler
    resources:
      - gpufractioningconfigs/finalizers
    verbs:
      - update
  # Write to the status subresource to report observedGeneration
  # and conditions back to the user.
  - apiGroups:
      - gpu-fractioning.kai.scheduler
    resources:
      - gpufractioningconfigs/status
    verbs:
      - get
      - patch
      - update
  # Leader election uses Lease objects to ensure only one controller
  # instance is active at a time.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - patch
      - update
      - watch
  # Manage DaemonSets created by the controller for each managed daemon
  # (fractiond, mpsd).
  - apiGroups:
      - apps
    resources:
      - daemonsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Read individual nodes to preserve LastTransitionTime when patching
  # conditions, list targeted nodes during finalizer cleanup on CR deletion,
  # and remove the driver-major node label that mpsd wrote in releases up to
  # 0.1.8 during that cleanup.
  # Reads go through the uncached API reader, not a cached list/watch informer,
  # so no "watch" verb.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - patch
  # Patch the gpu-fractioning.nvidia.com/Ready condition on GPU nodes.
  - apiGroups:
      - ""
    resources:
      - nodes/status
    verbs:
      - get
      - patch
  # List pods to determine per-node health for node condition patching.
  # Read via the uncached API reader (no pod informer), so no "watch" verb.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  # Read and watch the NVIDIA GPU Operator ClusterPolicy to report GPU
  # Operator readiness/version compatibility and react to version changes.
  - apiGroups:
      - nvidia.com
    resources:
      - clusterpolicies
    verbs:
      - get
      - list
      - watch
  # On OpenShift, NVIDIA GPU Operator installations may not expose a
  # ClusterPolicy. Fall back to the OLM ClusterServiceVersion to discover the
  # installed GPU Operator version, and watch it for OLM-driven version changes.
  # CSVs do not provide readiness, only version.
  - apiGroups:
      - operators.coreos.com
    resources:
      - clusterserviceversions
    verbs:
      - list
      - watch
  # Emit Kubernetes Events to surface reconciliation activity
  # (e.g. "GpuFractioningConfig reconciled successfully").
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
