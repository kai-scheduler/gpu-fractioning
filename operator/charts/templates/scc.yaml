{{- if and (include "gpu-fractioning.isOpenShift" .) .Values.openshift.securityContextConstraints.create }}
{{- $name := include "gpu-fractioning.sccName" . }}
# mpsd and fractiond run privileged, with host PID, and mount host paths for the
# MPS pipe directory and the NRI and CRI sockets — none of which restricted-v2
# permits. Granted to the daemon ServiceAccount only; the controller is
# unprivileged and stays on restricted-v2.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ $name }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
# Narrower than the built-in `privileged` SCC. Host paths are all-or-nothing:
# allowedHostPaths is a PodSecurityPolicy field that the API server prunes from
# an SCC, so there is no per-path allowlist to set.
allowPrivilegedContainer: true
allowPrivilegeEscalation: true
allowHostDirVolumePlugin: true
allowHostPID: true
allowHostIPC: false
allowHostNetwork: false
allowHostPorts: false
readOnlyRootFilesystem: false
# privileged: true already implies the full capability set; naming none keeps
# this from widening a non-privileged container admitted under the same SCC.
allowedCapabilities: []
defaultAddCapabilities: []
requiredDropCapabilities: []
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
  - hostPath
  - projected
  - secret
  - configMap
  - downwardAPI
  - emptyDir
# priority is unset on purpose: a nil priority sorts last, so this is never
# preferred for an unrelated pod that happens to be admissible under it. users
# and groups stay empty so access comes from the RoleBinding below, where
# `kubectl auth can-i` can see it and the release owns its lifecycle.
users: []
groups: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-scc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - {{ $name }}
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-scc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-scc
subjects:
  - kind: ServiceAccount
    name: {{ include "gpu-fractioning.daemonServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
