{{- if .Values.crdUpgrader.enabled }}
{{/*
Identity for the crd-upgrader Job, weighted ahead of it (-1 vs 2). Safe to
delete on success: Helm runs hook-succeeded deletions only once every hook in
the phase has completed.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gpu-fractioning.crdUpgraderName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-fractioning.crdUpgraderName" . }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
rules:
  {{/* create is scoped too: the Job only ever server-side applies, and the
       apiserver authorizes create on the apply path with the name from the URL,
       so resourceNames matches. This role cannot touch any other CRD. */}}
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - gpufractioningconfigs.gpu-fractioning.kai.scheduler
    verbs: ["create", "get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpu-fractioning.crdUpgraderName" . }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gpu-fractioning.crdUpgraderName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gpu-fractioning.crdUpgraderName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
