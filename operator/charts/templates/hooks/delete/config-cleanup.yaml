{{- if .Values.configCleanup.enabled }}
{{/*
Deletes the GpuFractioningConfig objects before Helm removes the release. Helm
deletes custom resources last, after the operator Deployment, so left to Helm
the CR would keep its finalizer forever and the DaemonSets it owns would keep
running. The Job waits until the operator has run its cleanup and the objects
are gone.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gpu-fractioning.configCleanupName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: {{ .Values.configCleanup.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "gpu-fractioning.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: config-cleanup
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "gpu-fractioning.configCleanupName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: config-cleanup
          image: "{{ .Values.images.operator.repository }}:{{ include "gpu-fractioning.imageTag" (dict "root" $ "tag" .Values.images.operator.tag) }}"
          imagePullPolicy: {{ .Values.images.operator.pullPolicy }}
          args:
            - delete-configs
            - --timeout={{ .Values.configCleanup.timeout }}
          {{- with include "gpu-fractioning.fipsOnlyEnv" . }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .Values.configCleanup.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
