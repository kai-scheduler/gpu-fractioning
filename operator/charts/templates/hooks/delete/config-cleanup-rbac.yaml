{{- if .Values.configCleanup.enabled }}
{{/*
Identity for the config-cleanup Job, weighted ahead of it (-1 vs 0). Safe to
delete on success: Helm runs hook-succeeded deletions only once every hook in
the phase has completed.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gpu-fractioning.configCleanupName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gpu-fractioning.configCleanupName" . }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
rules:
  - apiGroups: ["gpu-fractioning.kai.scheduler"]
    resources: ["gpufractioningconfigs"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gpu-fractioning.configCleanupName" . }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gpu-fractioning.configCleanupName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gpu-fractioning.configCleanupName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
