apiVersion: gpu-fractioning.kai.scheduler/v1alpha1
kind: GpuFractioningConfig
metadata:
  name: default
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
spec:
  nodeSelector:
    nvidia.com/gpu.present: "true"
  {{- if hasKey .Values "runtimeClassName" }}
  runtimeClassName: {{ .Values.runtimeClassName | quote }}
  {{- end }}
  {{- /*
    Each daemon stanza is passed through verbatim rather than field by field.
    Enumerating fields here means every CRD field added later is silently
    unreachable from values until someone remembers to add it too — which is how
    `--set fractioningAgent.nriSocketPath=...` came to be accepted by Helm and
    then dropped on the floor, on exactly the distributions (microk8s, k3s)
    whose socket paths make that field necessary.

    fractioningAgent is rendered even when empty, so the API server applies its
    field-level defaults such as retroactiveEnforcement=true.
  */}}
  {{- with .Values.fractioningAgent }}
  fractioningAgent:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  fractioningAgent: {}
  {{- end }}
  metricsAgent:
    {{- toYaml .Values.metricsAgent | nindent 4 }}
  {{- with .Values.mpsDaemon }}
  mpsDaemon:
    {{- toYaml . | nindent 4 }}
  {{- end }}
