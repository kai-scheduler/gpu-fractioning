apiVersion: gpu-fractioning.kai.scheduler/v1alpha1
kind: GpuFractioningConfig
metadata:
  name: default
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
spec:
  nodeSelector:
    nvidia.com/gpu.present: "true"
  {{- with .Values.daemonTolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if hasKey .Values "runtimeClassName" }}
  runtimeClassName: {{ .Values.runtimeClassName | quote }}
  {{- end }}
  {{- $agent := dict }}
  {{- with (.Values.fractioningAgent).logLevel }}
  {{- $_ := set $agent "logLevel" . }}
  {{- end }}
  {{- with (include "gpu-fractioning.criSocketPath" $) }}
  {{- $_ := set $agent "criSocketPath" . }}
  {{- end }}
  # Present (even if empty) so the API server applies field-level defaults such
  # as fractioningAgent.retroactiveEnforcement=true. An explicit null would not
  # do: the API server defaults an absent object, not one set to null.
  fractioningAgent:{{- if $agent }}{{ toYaml $agent | nindent 4 }}{{- else }} {}{{- end }}
  metricsAgent:
    enabled: {{ .Values.metricsAgent.enabled }}
    {{- if .Values.metricsAgent.logLevel }}
    logLevel: {{ .Values.metricsAgent.logLevel | quote }}
    {{- end }}
    {{- with .Values.metricsAgent.metricNames }}
    metricNames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .Values.metricsAgent.volumes }}
    volumes:
      {{- toYaml .Values.metricsAgent.volumes | nindent 6 }}
    {{- end }}
    {{- if .Values.metricsAgent.volumeMounts }}
    volumeMounts:
      {{- toYaml .Values.metricsAgent.volumeMounts | nindent 6 }}
    {{- end }}
