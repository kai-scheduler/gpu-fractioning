apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gpu-fractioning.fullname" . }}-daemon
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gpu-fractioning.fullname" . }}-daemon
subjects:
  - kind: ServiceAccount
    name: {{ include "gpu-fractioning.daemonServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
