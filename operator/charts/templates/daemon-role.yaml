apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gpu-fractioning.fullname" . }}-daemon
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
rules:
  # mpsd records the node-local NVIDIA driver major version as an annotation on
  # its own pod during startup; the operator reads it from there. Nothing the
  # daemons do needs a cluster-scoped grant.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - patch
