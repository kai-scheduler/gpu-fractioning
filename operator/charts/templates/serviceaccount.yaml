{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gpu-fractioning.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.daemonServiceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gpu-fractioning.daemonServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-fractioning.labels" . | nindent 4 }}
  {{- with .Values.daemonServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /*
  The daemon pods are built by the operator, not by this chart, so the chart
  cannot put imagePullSecrets on them directly. Hanging the secrets off their
  ServiceAccount is how they reach the pods: kubelet merges a ServiceAccount's
  imagePullSecrets into every pod that uses it. Without this, an install whose
  images live in a private registry deploys an operator that pulls fine and
  daemons that cannot pull at all.
*/}}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
