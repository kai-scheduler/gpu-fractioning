# Values shared with a parent chart. Helm merges an umbrella chart's `global`
# block into every subchart, so an installation-wide setting can be given once
# there instead of being repeated per subchart.
global:
  # fipsMode selects the FIPS-enabled image variants, which are built against a
  # CMVP-validated Go cryptographic module and run with FIPS mode on by default.
  # It appends "-fips" to every resolved image tag, whether that tag comes from
  # images.<service>.tag or the chart's appVersion, so FIPS selection stays
  # independent of version pinning.
  #
  #   off  - regular images (default)
  #   on   - FIPS images. This is the compliant production setting: the images
  #          already run in FIPS mode, and TLS silently declines to negotiate
  #          anything that is not approved.
  #   only - FIPS images, plus GODEBUG=fips140=only on every container. A call
  #          into a non-approved algorithm then errors or panics instead of
  #          succeeding.
  #
  #          Upstream Go documents "only" as a best-effort mode for testing,
  #          assessment and debugging, and explicitly not for production: it
  #          introduces crashes by design and can report both false positives
  #          and false negatives. It also reaches dependencies we do not
  #          control. Use it to assess an installation, not to run one.
  fipsMode: "off"

replicaCount: 1
leaderElect: true

images:
  operator:
    repository: ghcr.io/kai-scheduler/kai-gpu-fractioning/operator
    tag: ""
    pullPolicy: IfNotPresent
  fractiond:
    repository: ghcr.io/kai-scheduler/kai-gpu-fractioning/fractiond
    tag: ""
    pullPolicy: IfNotPresent
  metricsd:
    repository: ghcr.io/kai-scheduler/kai-gpu-fractioning/metricsd
    tag: ""
    pullPolicy: IfNotPresent
  mpsd:
    repository: ghcr.io/kai-scheduler/kai-gpu-fractioning/mpsd
    tag: ""
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# runtimeClassName sets the RuntimeClass for daemon pods that need NVIDIA
# GPU/NVML access. Set to "" to use the node's default runtime when it already
# provides NVIDIA GPU/NVML access.
runtimeClassName: "nvidia"

# supportSmSharing is the installation-time toggle for the sm-sharing compute
# mode: mpsd's shared MPS server (context-share, [servers.shared]) and
# fractiond's routing of the gpu-compute.mode: sm-sharing annotation to it.
# Disabling it reverts new workloads to the pre-sm-sharing behaviour without a
# code rollback: mpsd falls back to its pre-sm-sharing config *and* daemon
# invocation (no shared server, no multiuser mode), and fractiond rejects the
# sm-sharing annotation like any other invalid value.
#
# It applies at install/upgrade time and only to containers created afterwards.
# Flipping it does not migrate running containers: an sm-sharing container keeps
# the shared-server socket it was started with, and mpsd restarting without that
# server pulls the socket out from under it. Before disabling, stop or remove
# sm-sharing workloads and confirm the shared server has no clients left
# (nvidia-cuda-mps-control -p 3 client list, run in the mpsd pod).
supportSmSharing: true

# skipGpuStackVersionChecks bypasses the operator's NVIDIA GPU stack version
# gates. It is an escape hatch, not a supported configuration: when the operator
# reads an installation's versions wrongly and refuses to roll out, this unblocks
# it without a code rollback.
#
# It disables verification only — it does not make an unsupported GPU stack work.
# With the gates off, a GPU stack that genuinely cannot enforce GPU memory limits
# rolls the daemons out anyway, Ready goes True, and nothing reports the problem:
# fractiond injects the limits and no CDI hook applies them, so GPU memory goes
# unfenced. Only set this when you have confirmed out of band that the installed
# versions are supported and the operator is misreading them.
#
# The NVIDIA driver version check is separate and is not bypassed by this value.
skipGpuStackVersionChecks: false

# mpsd configures the MPS daemon (mpsd) managed by the operator.
mpsd:
  # auditLog toggles features.memacct.audit_log in the generated MPS
  # control-daemon config (nvidia-cuda-mps-control -a). memacct and
  # context-share are both always enabled; context-share backs the shared MPS
  # server that containers opt into via the gpu-compute.mode: sm-sharing
  # annotation.
  auditLog: true

metricsAgent:
  enabled: true
  # metricNames overrides the exported Prometheus metric names. Leave empty to
  # keep the built-in gpu_fractioning_* names. Set them to integrate with a consumer
  # that expects specific names. Labels are fixed: namespace, pod, pod_uuid,
  # gpu_uuid, gpu.
  metricNames: {}
    # gpuMemoryUsedBytes: <metric name>
    # gpuSmUtilizationPercent: <metric name>
    # gpuSmUtilizationPercentNormalized: <metric name>

serviceAccount:
  create: true
  name: ""
  annotations: {}

daemonServiceAccount:
  create: true
  name: ""
  annotations: {}

# metrics configures the controller's Prometheus metrics endpoint, served over
# plain HTTP on `port` (matching the metricsd GPU metrics and KAI-Scheduler).
metrics:
  # Serve controller metrics over plain HTTP on this port ("0" disables).
  enabled: true
  port: 8080

# Prometheus-Operator integration. When enabled (and the monitoring.coreos.com/v1
# CRDs are present), installs a ServiceMonitor for the controller metrics and a
# PodMonitor for the metricsd per-pod GPU metrics. Both scrape plain HTTP.
prometheus:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels on the ServiceMonitor/PodMonitor (e.g. a Prometheus `release`
  # selector label) so your Prometheus instance selects them.
  additionalLabels: {}

resources:
  operator:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi
      ephemeral-storage: 100Mi

nodeSelector: {}
tolerations: []
affinity: {}
