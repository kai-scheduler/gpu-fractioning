fractioningAgent:
  logLevel: debug

# Exercise the real toolkit runtime installed by GPU Operator.
runtimeClassName: nvidia

metricsAgent:
  logLevel: debug
  # Keep test process data separate from Mokka's CDI mount at /etc/nvml-mock.
  # Dockerfile.e2e points MOCK_NVML_CONFIG at this test-only directory.
  volumes:
    - name: nvml-mock-cfg
      configMap:
        name: nvml-mock-config
  volumeMounts:
    - name: nvml-mock-cfg
      mountPath: /etc/gpu-fractioning-test
      readOnly: true
