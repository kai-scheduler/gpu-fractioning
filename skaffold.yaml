# Skaffold builds all four component images and deploys them through the operator
# Helm chart (operator/charts) in one flow — the "4 images, use Skaffold + Helm"
# direction from PR review.
#
#   skaffold run -p e2e          # build + load into the local (k3d) cluster + helm install
#   skaffold dev -p e2e          # same, with rebuild/redeploy on file changes
#   skaffold delete -p e2e       # uninstall
#
# The default profile builds prod-style images. The `e2e` profile switches mpsd
# to the fake-mps Dockerfile and metricsd to Dockerfile.e2e (both bake in the
# nvml-mock .so for fake-GPU clusters), then pushes the images to the k3d-managed
# local registry (create-cluster.py) with pullPolicy=IfNotPresent, so a node that
# evicts an image under disk pressure re-pulls it instead of wedging at
# ErrImageNeverPull.
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: gpu-fractioning

build:
  # push:false (default profile) keeps images local; Skaffold auto-loads them
  # into a k3d/kind cluster when the current kube-context is one. The e2e profile
  # overrides this to push:true and, with --default-repo=localhost:<port>
  # (test/e2e/e2e.mk), pushes into the k3d local registry instead — so evicted
  # images can be re-pulled. All Dockerfiles build from the repo root so their
  # cross-module COPYs resolve.
  #
  # useBuildkit: BuildKit populates the $TARGETPLATFORM/$BUILDPLATFORM build args
  # that every Dockerfile's `FROM --platform=...` relies on. The legacy docker
  # builder (the GitHub runner's default) leaves them empty, which breaks
  # metricsd's `FROM --platform=$TARGETPLATFORM` with an "invalid platform" error.
  local:
    push: false
    useBuildkit: true
    # Build all four images concurrently instead of Skaffold's default serial
    # build. They share a warm BuildKit base layer (golang:1.26-bookworm), so
    # the parallel builds overlap heavily and shave minutes off the deploy step.
    concurrency: 0
  artifacts:
    # operator/fractiond are CGO_ENABLED=0 and build FROM $BUILDPLATFORM,
    # cross-compiling via the buildkit-provided TARGETARCH. mpsd and metricsd
    # link NVML via cgo and build FROM $TARGETPLATFORM inside their Dockerfiles.
    - image: gpu-fractioning
      context: .
      docker:
        dockerfile: operator/Dockerfile
    - image: fractiond
      context: .
      docker:
        dockerfile: fractioning-manager/fractiond/build/Dockerfile
    - image: mpsd
      context: .
      docker:
        dockerfile: fractioning-manager/mpsd/build/Dockerfile
    # metricsd links NVML (CGO=1) and builds FROM $TARGETPLATFORM. Its Dockerfile
    # hardcodes `ARG TARGETARCH=amd64`, which overrides buildkit's platform value,
    # so the e2e profile passes TARGETARCH explicitly to build for the host arch.
    - image: metricsd
      context: .
      docker:
        dockerfile: fractioning-manager/metricsd/Dockerfile

deploy:
  # Fail a wedged rollout fast instead of skaffold's 10-min default. An
  # ErrImageNeverPull (image disk-pressure-evicted from a node's containerd)
  # never recovers under pullPolicy: Never, so waiting the full default only
  # burns CI minutes and pushes the real failure past the job timeout.
  statusCheckDeadlineSeconds: 180
  helm:
    releases:
      - name: gso
        chartPath: operator/charts
        namespace: gpu-fractioning
        createNamespace: true
        # Map each built image into the chart's images.<name>.{repository,tag}
        # structure. Tag only (no digest): images are loaded into k3d by tag.
        setValueTemplates:
          images.operator.repository: "{{.IMAGE_REPO_gpu_fractioning}}"
          images.operator.tag: "{{.IMAGE_TAG_gpu_fractioning}}"
          images.fractiond.repository: "{{.IMAGE_REPO_fractiond}}"
          images.fractiond.tag: "{{.IMAGE_TAG_fractiond}}"
          images.mpsd.repository: "{{.IMAGE_REPO_mpsd}}"
          images.mpsd.tag: "{{.IMAGE_TAG_mpsd}}"
          images.metricsd.repository: "{{.IMAGE_REPO_metricsd}}"
          images.metricsd.tag: "{{.IMAGE_TAG_metricsd}}"

profiles:
  - name: e2e
    patches:
      # Push into the k3d local registry (create-cluster.py) instead of
      # auto-loading images once. Paired with --default-repo=localhost:<port>
      # (test/e2e/e2e.mk) and pullPolicy=IfNotPresent below, this lets a node
      # re-pull an image it evicted under disk pressure.
      - op: replace
        path: /build/local/push
        value: true
      # mpsd: use the fake-mps image (hack/fake-mps) instead of the real
      # nvidia/cuda-based build. It bundles the REAL mpsd supervisor, nvml-mock
      # for the startup driver-major label, and a fake nvidia-cuda-mps-control
      # that just creates the MPS control socket and idles, so mpsd reaches Ready
      # on a GPU-less k3d node. Paired with create-cluster.py repointing the
      # "nvidia" RuntimeClass at runc, this lets the operator reach full Ready
      # without a GPU.
      - op: replace
        path: /build/artifacts/2/docker/dockerfile
        value: hack/fake-mps/Dockerfile
      # metricsd: use the e2e Dockerfile which bakes in the nvml-mock .so so
      # NVML calls resolve on fake-GPU k3d clusters without a real NVIDIA driver.
      - op: replace
        path: /build/artifacts/3/docker/dockerfile
        value: fractioning-manager/metricsd/Dockerfile.e2e
      # Pass the host arch so cgo compiles natively under QEMU emulation.
      - op: add
        path: /build/artifacts/3/docker/buildArgs
        value:
          TARGETARCH: "{{.E2E_ARCH}}"
      # Pull from the k3d local registry on demand; IfNotPresent means a node
      # that evicted an image re-pulls it (vs. Never, which wedges forever).
      - op: add
        path: /deploy/helm/releases/0/setValues
        value:
          images.operator.pullPolicy: IfNotPresent
          images.fractiond.pullPolicy: IfNotPresent
          images.mpsd.pullPolicy: IfNotPresent
          images.metricsd.pullPolicy: IfNotPresent
          metricsAgent.runtimeClassName: ""
      # Clear fractiond's metrics runtimeClassName via a values file; the e2e
      # metricsd image provides nvml-mock itself, and skaffold drops empty-string
      # setValues entries, so --set can't do this.
      - op: add
        path: /deploy/helm/releases/0/valuesFiles
        value: [ "operator/charts/e2e-values.yaml" ]
