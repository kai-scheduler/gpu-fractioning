name: Bug report
description: Report a reproducible problem in gpu-fractioning
title: "[Bug]: "
labels:
  - kind/bug
  - triage/needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve gpu-fractioning.
        Do not report security vulnerabilities here; follow [SECURITY.md](https://github.com/kai-scheduler/gpu-fractioning/blob/main/SECURITY.md) instead.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project is affected?
      options:
        - operator
        - fractiond
        - metricsd
        - mpsd
        - Helm chart
        - CI or release automation
        - Documentation
        - Other or unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Provide the release, image tag, chart version, or commit SHA.
      placeholder: v0.1.0, main@abcdef0, or an image digest
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Kubernetes, GPU Operator, NVIDIA driver, container runtime, and GPU details where relevant.
      placeholder: |
        Kubernetes version:
        GPU Operator version:
        NVIDIA driver version:
        Container runtime:
        GPU model:
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Explain who is affected, how severely, and whether a workaround exists.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Install ...
        2. Apply ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or configuration
      description: Remove credentials, tokens, customer information, and other sensitive data before posting.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, links, suspected regressions, or workarounds.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched open and closed issues and did not find a duplicate.
          required: true
        - label: I agree to follow this project's Code of Conduct.
          required: true
