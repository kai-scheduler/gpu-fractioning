name: E2E

# NOTE: no trigger-level `paths` filter. This job is a *required* status check,
# and a path-filtered workflow never reports a status on PRs that don't touch its
# paths — leaving the required check stuck "Expected — Waiting for status" and the
# PR blocked forever (e.g. an operator-only PR). Instead the job always runs and
# decides *internally* (the `changes` step below) whether the suite is relevant:
# if so it runs for real (pending until done); if not, every real step is skipped
# and the job passes immediately (exit 0), satisfying branch protection cheaply.
on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed files via the pulls API.
  pull-requests: read

# go.work is for local dev; CI builds via module-scoped make/skaffold targets.
env:
  GOWORK: "off"
  E2E_CLUSTER_NAME: gpu-fractioning-e2e
  E2E_GPU_WORKER_NODES: 2          # GPU worker nodes
  E2E_NON_GPU_WORKER_NODES: 1  # plain (no-GPU) worker nodes, for a mixed topology
  # Pin to a known-good fake-gpu-operator release. Bump deliberately.
  E2E_FAKE_GPU_OPERATOR_VERSION: 0.2.0

jobs:
  metrics:
    name: Metrics e2e
    runs-on: ubuntu-latest
    # ~8 min build+deploy + a ~10-11 min suite (each nvml-mock SetProcesses cycle
    # restarts metricsd and waits ~90 s for the ConfigMap to propagate, ×~11
    # tests). 20 min cut the last test off mid-run; 25 clears it with margin.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Decide whether this change actually needs the e2e suite. The suite tests
      # the daemon runtime (metricsd/mpsd/fractiond) via the e2e harness + skaffold
      # build, so only those paths make it "needed". Everything below is gated on
      # this — when false, the job is a fast, green no-op.
      - name: Detect e2e-relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            e2e:
              # operator/** and operator/charts/** are deliberately NOT listed:
              # an operator- or chart-only PR should pass this required check via
              # the exit-0 path below without spinning up the full e2e cluster.
              # The suite exercises the daemon runtime, so only the daemon
              # modules, the e2e harness, and its build/setup inputs are relevant.
              - 'fractioning-manager/metricsd/**'
              - 'fractioning-manager/mpsd/**'
              - 'fractioning-manager/fractiond/**'
              - 'test/e2e/**'
              - 'skaffold.yaml'
              - '.github/workflows/e2e.yaml'
              - '.github/actions/e2e-setup/**'

      - name: No e2e-relevant changes — skipping suite
        if: ${{ steps.changes.outputs.e2e != 'true' }}
        run: echo "No changes under e2e-relevant paths; the metrics suite is not required for this change. Passing."

      # Reclaim runner disk before building/loading images. The runner starts
      # ~79% full (16 GiB free); building the four images and importing them into
      # each of the k3d nodes' containerd would push it toward the kubelet's
      # disk-pressure threshold and risk image eviction. This keeps ~30 GiB free
      # after everything is loaded (measured), well clear of that threshold —
      # protective headroom, not the fix for any specific failure.
      - name: Free disk space
        if: ${{ steps.changes.outputs.e2e == 'true' }}
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/.ghcup /usr/share/swift /usr/local/graalvm /usr/lib/jvm || true
          sudo docker system prune --all --force --volumes || true
          echo "after:"; df -h /

      # Suite-agnostic infra: toolchain + k3d/fake-gpu-operator cluster.
      # Reused as-is by future e2e suites (mpsd/fractiond).
      - name: Set up e2e cluster
        if: ${{ steps.changes.outputs.e2e == 'true' }}
        uses: ./.github/actions/e2e-setup
        with:
          gpu-worker-nodes: ${{ env.E2E_GPU_WORKER_NODES }}
          non-gpu-worker-nodes: ${{ env.E2E_NON_GPU_WORKER_NODES }}
          cluster-name: ${{ env.E2E_CLUSTER_NAME }}
          fake-gpu-operator-version: ${{ env.E2E_FAKE_GPU_OPERATOR_VERSION }}

      # Skaffold builds the four images, loads them into k3d, and helm-installs
      # the operator chart; the operator then creates the fractiond DaemonSet
      # (with the metricsd sidecar under test). Waits on the fractiond DaemonSet
      # rollout, not the operator's aggregate Ready.
      - name: Build, load and deploy the stack (skaffold + helm)
        if: ${{ steps.changes.outputs.e2e == 'true' }}
        run: make e2e-deploy

      - name: Run metrics e2e tests
        if: ${{ steps.changes.outputs.e2e == 'true' }}
        run: make test-e2e-metrics

      # Runs on a failed step AND on a timeout (job cancellation) — the previous
      # `if: failure()` was skipped whenever the job hit its timeout, which is
      # exactly when a hung deploy/test needs to be diagnosed. Node conditions +
      # disk usage confirm or rule out the disk-pressure/ErrImageNeverPull path.
      - name: Collect diagnostics
        if: ${{ (failure() || cancelled()) && steps.changes.outputs.e2e == 'true' }}
        run: |
          export KUBECONFIG="$HOME/.kube/${E2E_CLUSTER_NAME}.yaml"
          echo "::group::disk"; df -h / || true; echo "::endgroup::"
          echo "::group::nodes"; kubectl get nodes -o wide || true
          kubectl describe nodes | grep -iE 'Name:|DiskPressure|MemoryPressure|Taints|Non-terminated' || true; echo "::endgroup::"
          echo "::group::pods"; kubectl get pods -A -o wide || true; echo "::endgroup::"
          echo "::group::events"; kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true; echo "::endgroup::"
          kubectl -n gpu-fractioning get gpufractioningconfig -o yaml || true
          kubectl -n gpu-fractioning describe pods || true
          kubectl -n gpu-fractioning logs -l app.kubernetes.io/component=fractiond --all-containers --tail=200 || true
          kubectl -n gpu-fractioning logs deploy/gso-gpu-fractioning --tail=200 || true
          kubectl -n gpu-operator logs -l app=status-updater --tail=200 || true

      - name: Delete e2e cluster
        if: ${{ always() && steps.changes.outputs.e2e == 'true' }}
        run: make e2e-cluster-down

  operator:
    name: Operator e2e
    runs-on: ubuntu-latest
    # ~8 min build+deploy + the operator suite (CR delete/recreate rollouts +
    # fault-recovery windows + config re-rolls). The suite's own `go test`
    # timeout is 40m; keep the job comfortably above it so a genuine hang dumps
    # goroutine stacks instead of being killed at the job limit.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      # The operator suite exercises the controller itself, so operator/** and the
      # chart/API are e2e-relevant here. fractioning-manager/fractiond/** is
      # intentionally NOT listed: a fractiond-only change can't affect what this
      # suite asserts — the fractiond pod spec it checks is rendered by the operator
      # + chart, not by fractiond's source. (If fractiond ever needs a new mount/env,
      # that's an operator/chart change, already covered by operator/**.) Such a
      # change is validated by the dedicated fractiond job (below), which redeploys
      # the full stack and re-asserts steady state, so running this ~long job too
      # would be redundant. mpsd stays (this suite asserts the mpsd pod spec +
      # fault/recovery); metricsd is covered by the metrics job. Same
      # exit-0-when-irrelevant pattern so this stays cheap.
      - name: Detect e2e-relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            e2e:
              - 'operator/**'
              - 'api/**'
              - 'fractioning-manager/mpsd/**'
              - 'test/e2e/**'
              - 'skaffold.yaml'
              - '.github/workflows/e2e.yaml'
              - '.github/actions/e2e-setup/**'

      - name: No e2e-relevant changes — skipping suite
        if: ${{ steps.changes.outputs.e2e != 'true' }}
        run: echo "No changes under e2e-relevant paths; the operator suite is not required for this change. Passing."

      - name: Free disk space
        if: ${{ steps.changes.outputs.e2e == 'true' }}
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/.ghcup /usr/share/swift /usr/local/graalvm /usr/lib/jvm || true
          sudo docker system prune --all --force --volumes || true
          echo "after:"; df -h /

      - name: Set up e2e cluster
        if: ${{ steps.changes.outputs.e2e == 'true' }}
        uses: ./.github/actions/e2e-setup
        with:
          gpu-worker-nodes: ${{ env.E2E_GPU_WORKER_NODES }}
          non-gpu-worker-nodes: ${{ env.E2E_NON_GPU_WORKER_NODES }}
          cluster-name: ${{ env.E2E_CLUSTER_NAME }}
          fake-gpu-operator-version: ${{ env.E2E_FAKE_GPU_OPERATOR_VERSION }}

      # Same deploy as the metrics job. The operator suite waits for aggregate
      # Ready and asserts both managed DaemonSets.
      - name: Build, load and deploy the stack (skaffold + helm)
        if: ${{ steps.changes.outputs.e2e == 'true' }}
        run: make e2e-deploy

      - name: Run operator e2e tests
        if: ${{ steps.changes.outputs.e2e == 'true' }}
        run: make test-e2e-operator

      - name: Collect diagnostics
        if: ${{ (failure() || cancelled()) && steps.changes.outputs.e2e == 'true' }}
        run: |
          export KUBECONFIG="$HOME/.kube/${E2E_CLUSTER_NAME}.yaml"
          echo "::group::disk"; df -h / || true; echo "::endgroup::"
          echo "::group::nodes"; kubectl get nodes -o wide || true
          kubectl describe nodes | grep -iE 'Name:|gpu-fractioning.nvidia.com/Ready|Taints|Non-terminated' || true; echo "::endgroup::"
          echo "::group::pods"; kubectl get pods -A -o wide || true; echo "::endgroup::"
          echo "::group::events"; kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true; echo "::endgroup::"
          kubectl get gpufractioningconfig default -o yaml || true
          kubectl -n gpu-fractioning describe pods || true
          kubectl -n gpu-fractioning logs -l app.kubernetes.io/component=fractiond --all-containers --tail=200 || true
          kubectl -n gpu-fractioning logs -l app.kubernetes.io/component=mpsd --tail=200 || true
          kubectl -n gpu-fractioning logs deploy/gso-gpu-fractioning --tail=200 || true

      - name: Delete e2e cluster
        if: ${{ always() && steps.changes.outputs.e2e == 'true' }}
        run: make e2e-cluster-down

  fractiond:
    name: Fractiond e2e
    runs-on: ubuntu-latest
    # ~8 min build+deploy + a short suite (a few annotated workload pods + one
    # fail-open CR re-roll). The suite's own `go test` timeout is 20m; keep the
    # job above it so a genuine hang dumps goroutine stacks rather than being
    # killed at the job limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The fractiond suite exercises the fractiond NRI data plane, so only the
      # fractiond module, the API it shares, and the e2e harness/build inputs are
      # relevant. operator/**, mpsd/** and metricsd/** are covered by the other
      # jobs; a change there shouldn't force this one. Same exit-0-when-irrelevant
      # pattern as the other jobs so this stays a cheap required check.
      - name: Detect e2e-relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            e2e:
              - 'fractioning-manager/fractiond/**'
              - 'api/**'
              - 'test/e2e/**'
              - 'skaffold.yaml'
              - '.github/workflows/e2e.yaml'
              - '.github/actions/e2e-setup/**'

      - name: No e2e-relevant changes — skipping suite
        if: ${{ steps.changes.outputs.e2e != 'true' }}
        run: echo "No changes under e2e-relevant paths; the fractiond suite is not required for this change. Passing."

      - name: Free disk space
        if: ${{ steps.changes.outputs.e2e == 'true' }}
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/.ghcup /usr/share/swift /usr/local/graalvm /usr/lib/jvm || true
          sudo docker system prune --all --force --volumes || true
          echo "after:"; df -h /

      - name: Set up e2e cluster
        if: ${{ steps.changes.outputs.e2e == 'true' }}
        uses: ./.github/actions/e2e-setup
        with:
          gpu-worker-nodes: ${{ env.E2E_GPU_WORKER_NODES }}
          non-gpu-worker-nodes: ${{ env.E2E_NON_GPU_WORKER_NODES }}
          cluster-name: ${{ env.E2E_CLUSTER_NAME }}
          fake-gpu-operator-version: ${{ env.E2E_FAKE_GPU_OPERATOR_VERSION }}

      # Same deploy as the other jobs (skaffold builds all four images + helm
      # installs the chart). The fractiond suite waits FX-STEADY, then exercises
      # fractiond's injection against annotated workloads.
      - name: Build, load and deploy the stack (skaffold + helm)
        if: ${{ steps.changes.outputs.e2e == 'true' }}
        run: make e2e-deploy

      - name: Run fractiond e2e tests
        if: ${{ steps.changes.outputs.e2e == 'true' }}
        run: make test-e2e-fractiond

      - name: Collect diagnostics
        if: ${{ (failure() || cancelled()) && steps.changes.outputs.e2e == 'true' }}
        run: |
          export KUBECONFIG="$HOME/.kube/${E2E_CLUSTER_NAME}.yaml"
          echo "::group::disk"; df -h / || true; echo "::endgroup::"
          echo "::group::nodes"; kubectl get nodes -o wide || true
          kubectl describe nodes | grep -iE 'Name:|gpu-fractioning.nvidia.com/Ready|Taints|Non-terminated' || true; echo "::endgroup::"
          echo "::group::pods"; kubectl get pods -A -o wide || true; echo "::endgroup::"
          echo "::group::events"; kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true; echo "::endgroup::"
          kubectl get gpufractioningconfig default -o yaml || true
          kubectl -n operator-e2e describe pods || true
          kubectl -n gpu-fractioning describe pods || true
          kubectl -n gpu-fractioning logs -l app.kubernetes.io/component=fractiond --all-containers --tail=200 || true
          kubectl -n gpu-fractioning logs deploy/gso-gpu-fractioning --tail=200 || true

      - name: Delete e2e cluster
        if: ${{ always() && steps.changes.outputs.e2e == 'true' }}
        run: make e2e-cluster-down
