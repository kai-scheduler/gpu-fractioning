name: Push Artifacts

# Publishes the four component images and the Helm chart to
# ghcr.io/kai-scheduler/gpu-fractioning.
#
#   * push to main        → dev artifacts, single-arch (amd64), version 0.0.0-<short-sha>.
#   * workflow_call(v...)  → release artifacts, multi-arch (amd64+arm64), version = tag,
#                            plus FIPS image variants tagged <version>-fips.
#   * workflow_dispatch    → the same as a release, under a throwaway version, so the
#                            release path can be rehearsed without cutting a release.
#
# release.yaml calls this on `release: published`, passing the tag as `version`.
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: 'Release version, e.g. v0.1.0 (omit for a dev build off main)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        # Non-empty on purpose: the FIPS job is gated on this input, so a blank
        # default would let a manual run finish green with that job silently
        # skipped. Defaulted, a manual run reaches the multi-arch FIPS build and
        # the linkage check, which nothing else exercises before a real release.
        description: >-
          Version to publish. The default rehearses the full release path and can
          be deleted from ghcr afterwards; pass a real tag only to re-publish a
          release.
        required: false
        default: v0.0.0-fipstest
        type: string

permissions:
  contents: read
  packages: write

env:
  GOWORK: "off"
  DOCKER_REPO_BASE: ghcr.io/kai-scheduler/gpu-fractioning
  # helm push appends the chart name to the namespace it is given, so pushing to
  # the org namespace lands the chart at ghcr.io/kai-scheduler/gpu-fractioning —
  # the same path the component images hang off as ghcr.io/.../gpu-fractioning/*.
  CHART_REPO_NAMESPACE: ghcr.io/kai-scheduler

jobs:
  push-artifacts:
    name: Build and publish to ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: ./.github/actions/image-build-setup
        with:
          version: ${{ inputs.version }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v5

      - name: Build and push images
        run: |
          make docker-buildx \
            VERSION="${{ steps.setup.outputs.version }}" \
            DOCKER_BUILD_PLATFORM="${{ steps.setup.outputs.platforms }}" \
            DOCKER_BUILDX_OUTPUT="--push"

      - name: Package and push Helm chart
        run: |
          set -euo pipefail
          VERSION="${{ steps.setup.outputs.version }}"
          # The chart's image repositories already point at ghcr.io/kai-scheduler/gpu-fractioning/*
          # and image tags default to .Chart.AppVersion, so no values rewrite is needed —
          # packaging with --app-version pins every daemon image to this version.
          helm package operator/charts --version "$VERSION" --app-version "$VERSION" -d ./dist
          helm push "./dist/gpu-fractioning-$VERSION.tgz" "oci://${CHART_REPO_NAMESPACE}"

  # FIPS variants are built whenever a version is supplied, which means releases
  # and manual runs but not pushes to main. Doubling every image build on each
  # push isn't worth the runner time — the consumers who need FIPS pull tagged
  # releases. There is no separate FIPS chart: the chart selects the "-fips" tag
  # at render time from a values setting.
  #
  # Deliberately not chained to push-artifacts: it needs nothing that job
  # produces, so the two builds run in parallel — which matters because the arm64
  # legs of mpsd and metricsd are cgo and build under QEMU emulation.
  push-fips-images:
    name: Build and publish FIPS images to ghcr
    if: inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: ./.github/actions/image-build-setup
        with:
          version: ${{ inputs.version }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # FIPS=1 links the pinned Go Cryptographic Module and appends "-fips" to
      # every image tag. A multi-arch build cannot be held locally, so buildx
      # publishes as it builds — which is why this publishes under a staging
      # version. Verifying the "-fips" tag directly would mean the tag consumers
      # pull had already gone public before anything confirmed it was compliant.
      - name: Build and push FIPS images under a staging tag
        run: |
          make docker-buildx \
            FIPS=1 \
            VERSION="${{ steps.setup.outputs.version }}-unverified" \
            DOCKER_BUILD_PLATFORM="${{ steps.setup.outputs.platforms }}" \
            DOCKER_BUILDX_OUTPUT="--push"

      # The module version comes from the Makefile rather than being repeated
      # here, so the pin and the assertion that checks it cannot drift apart.
      - name: Verify FIPS linkage
        run: |
          hack/verify-fips-images.sh \
            --repo "${DOCKER_REPO_BASE}" \
            --tag "${{ steps.setup.outputs.version }}-unverified-fips" \
            --module "$(make -s print-gofips140-version)" \
            --platforms "${{ steps.setup.outputs.platforms }}"

      # A registry-side manifest copy of images that have just passed
      # verification: no rebuild, the multi-arch index survives, and the "-fips"
      # tag comes into existence only if the check succeeded. The staging tag is
      # left behind deliberately — on failure it is the artifact to investigate.
      - name: Promote verified images to the -fips tag
        run: |
          make docker-promote \
            FROM_TAG="${{ steps.setup.outputs.version }}-unverified-fips" \
            TO_TAG="${{ steps.setup.outputs.version }}-fips"
