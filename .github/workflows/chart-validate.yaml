name: Chart Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'operator/charts/**'
      - '.github/workflows/chart-validate.yaml'
  push:
    branches: [main]
    paths:
      - 'operator/charts/**'

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: "0.6.7"
  HELM_UNITTEST_VERSION: "1.1.2"

jobs:
  chart-validate:
    name: helm lint + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: helm lint
        run: helm lint operator/charts

      # Renders the chart against the cases in operator/charts/tests/. kubeconform
      # below only checks that the output is valid Kubernetes; this checks that
      # the output is the *intended* Kubernetes, which is what catches a values
      # change silently not reaching a template.
      - name: helm unittest
        run: |
          set -euo pipefail
          # Unpacked straight into Helm's plugin directory rather than fetched
          # with `helm plugin install`, which as of Helm 3.19 verifies the
          # plugin source and rejects this one outright. The published SHA-256
          # is checked instead, so the download is still pinned and verified.
          base="https://github.com/helm-unittest/helm-unittest/releases/download/v${HELM_UNITTEST_VERSION}"
          asset="helm-unittest-linux-amd64-${HELM_UNITTEST_VERSION}.tgz"
          curl -fsSL -o "/tmp/${asset}" "${base}/${asset}"
          expected="$(curl -fsSL "${base}/helm-unittest-checksum.sha" \
            | grep -F "${asset}" | awk '{print $1}')"
          [ -n "${expected}" ] || { echo "no checksum published for ${asset}" >&2; exit 1; }
          echo "${expected}  /tmp/${asset}" | sha256sum -c -
          # The archive has no top-level directory, so it unpacks into one we
          # create; the plugin name Helm registers comes from its plugin.yaml.
          plugin_dir="$(helm env HELM_PLUGINS)/helm-unittest"
          mkdir -p "${plugin_dir}"
          tar -xzf "/tmp/${asset}" -C "${plugin_dir}"
          make chart-test

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Render and validate manifests
        run: |
          set -euo pipefail
          # Validate both the default render and the monitors-enabled render.
          # Advertise the Prometheus Operator API so Helm renders ServiceMonitor
          # and PodMonitor when prometheus.enabled=true, as it would on a cluster
          # where the corresponding CRDs are installed.
          # -ignore-missing-schemas skips CRs whose CRD schemas aren't published
          # (our GpuFractioningConfig, plus ServiceMonitor/PodMonitor from the
          # Prometheus Operator) rather than failing on them.
          # --include-crds: helm template omits crds/ by default, which would
          # drop the CRD from kubeconform's coverage entirely.
          for extra in "" "--set prometheus.enabled=true"; do
            echo "== helm template ${extra:-(defaults)} =="
            helm template gpu-fractioning operator/charts $extra \
              --include-crds \
              --api-versions monitoring.coreos.com/v1 \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -kubernetes-version 1.31.0
          done
